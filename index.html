<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2a1a12" />
  <meta name="description" content="کونەمێروو — یاریی وشە کوردییەکان" />
  <title>کونەمێروو</title>
  <link rel="icon" href="assets/favicon.png" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <div class="bg" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>
  <canvas id="fireflies" aria-hidden="true"></canvas>

  <main class="stage">
    <section class="glass" aria-label="کونەمێروو">

        class="logo"
        src="assets/logo.png"
        width="1024"
        height="270"
        alt="کونەمێروو"
        decoding="async"
        draggable="false"
      />
      <p class="tagline">یاریی وشە کوردییەکان</p>
      <!-- لینکی تێلێگرام لێرە بگۆڕە -->
      <a
        class="cta"
        href="https://t.me/kunemerubot"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg class="cta-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8-1.6 7.54c-.12.54-.44.67-.9.42l-2.48-1.83-1.2 1.15c-.13.13-.24.24-.5.24l.18-2.55 4.64-4.2c.2-.18-.04-.28-.31-.1l-5.74 3.61-2.47-.77c-.54-.17-.55-.54.11-.8l9.66-3.72c.45-.16.84.1.61.81z"/>
        </svg>
        <span>دەستپێکردن</span>
      </a>
    </section>
  </main>

  <script src="fireflies.js" defer></script>
</body>
</html>
